<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Illustrative curve showing a ceiling mold job growing larger the longer a leak is left"><title>Illustrative curve showing a ceiling mold job growing larger the longer a leak is left</title><rect width="640" height="380" fill="#f5f8f6"/><defs><marker id="w" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#10231f"/></marker></defs><path d="M60 320 H600" fill="none" stroke="#10231f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w)"/><path d="M60 320 V40" fill="none" stroke="#10231f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w)"/><path d="M70 310 C220 305 330 280 400 220 S520 80 585 52" fill="none" stroke="#c93a17" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="130" cy="307" r="9" fill="#fff" stroke="#c93a17" stroke-width="3"/><text x="130" y="279" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="800" fill="#10231f" text-anchor="middle">First days</text><text x="130" y="297" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="600" fill="#41584f" text-anchor="middle">Dry in place</text><circle cx="330" cy="262" r="9" fill="#fff" stroke="#c93a17" stroke-width="3"/><text x="330" y="234" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="800" fill="#10231f" text-anchor="middle">Weeks</text><text x="330" y="252" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="600" fill="#41584f" text-anchor="middle">Cut out and patch</text><circle cx="520" cy="105" r="9" fill="#fff" stroke="#c93a17" stroke-width="3"/><text x="450" y="75" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="800" fill="#10231f" text-anchor="end">Months</text><text x="450" y="93" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="600" fill="#41584f" text-anchor="end">Larger rebuild</text><text x="330" y="352" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="700" fill="#10231f" text-anchor="middle">Time since the leak</text><text transform="translate(26 190) rotate(-90)" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="700" fill="#10231f" text-anchor="middle">Size of the job</text><text x="600" y="30" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="600" fill="#41584f" text-anchor="end">Illustrative, not to scale</text></svg>