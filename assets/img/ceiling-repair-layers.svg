<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="Layer diagram of a ceiling repair from joists and insulation to drywall, tape, texture, primer and paint"><title>Layer diagram of a ceiling repair from joists and insulation to drywall, tape, texture, primer and paint</title><rect width="640" height="440" fill="#f5f8f6"/><rect x="30" y="20" width="250" height="46" rx="8" fill="#c9a87a" stroke="#10231f" stroke-width="2"/><circle cx="30" cy="43" r="15" fill="#0e6b63" stroke="#0e6b63" stroke-width="1"/><text x="30" y="49" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="300" y="40" font-family="system-ui,Arial,sans-serif" font-size="17" font-weight="800" fill="#10231f" text-anchor="start">Joists, cleaned</text><text x="300" y="60" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="600" fill="#41584f" text-anchor="start">Framing checked and HEPA cleaned</text><rect x="30" y="78" width="250" height="46" rx="8" fill="#f1e7c4" stroke="#10231f" stroke-width="2"/><circle cx="30" cy="101" r="15" fill="#0e6b63" stroke="#0e6b63" stroke-width="1"/><text x="30" y="107" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="300" y="98" font-family="system-ui,Arial,sans-serif" font-size="17" font-weight="800" fill="#10231f" text-anchor="start">Insulation</text><text x="300" y="118" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="600" fill="#41584f" text-anchor="start">Replaced where it was removed</text><rect x="30" y="136" width="250" height="46" rx="8" fill="#e9eeeb" stroke="#10231f" stroke-width="2"/><circle cx="30" cy="159" r="15" fill="#0e6b63" stroke="#0e6b63" stroke-width="1"/><text x="30" y="165" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="300" y="156" font-family="system-ui,Arial,sans-serif" font-size="17" font-weight="800" fill="#10231f" text-anchor="start">New drywall</text><text x="300" y="176" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="600" fill="#41584f" text-anchor="start">Mold-resistant board in damp rooms</text><rect x="30" y="194" width="250" height="46" rx="8" fill="#d7dfdb" stroke="#10231f" stroke-width="2"/><circle cx="30" cy="217" r="15" fill="#0e6b63" stroke="#0e6b63" stroke-width="1"/><text x="30" y="223" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="300" y="214" font-family="system-ui,Arial,sans-serif" font-size="17" font-weight="800" fill="#10231f" text-anchor="start">Tape and mud</text><text x="300" y="234" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="600" fill="#41584f" text-anchor="start">Thin coats, dry between each</text><rect x="30" y="252" width="250" height="46" rx="8" fill="#cbd8d3" stroke="#10231f" stroke-width="2"/><circle cx="30" cy="275" r="15" fill="#0e6b63" stroke="#0e6b63" stroke-width="1"/><text x="30" y="281" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="300" y="272" font-family="system-ui,Arial,sans-serif" font-size="17" font-weight="800" fill="#10231f" text-anchor="start">Texture</text><text x="300" y="292" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="600" fill="#41584f" text-anchor="start">Matched to the rest of the room</text><rect x="30" y="310" width="250" height="46" rx="8" fill="#e4f1ec" stroke="#10231f" stroke-width="2"/><circle cx="30" cy="333" r="15" fill="#0e6b63" stroke="#0e6b63" stroke-width="1"/><text x="30" y="339" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="300" y="330" font-family="system-ui,Arial,sans-serif" font-size="17" font-weight="800" fill="#10231f" text-anchor="start">Primer</text><text x="300" y="350" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="600" fill="#41584f" text-anchor="start">Seals leftover staining</text><rect x="30" y="368" width="250" height="46" rx="8" fill="#ffffff" stroke="#10231f" stroke-width="2"/><circle cx="30" cy="391" r="15" fill="#0e6b63" stroke="#0e6b63" stroke-width="1"/><text x="30" y="397" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">7</text><text x="300" y="388" font-family="system-ui,Arial,sans-serif" font-size="17" font-weight="800" fill="#10231f" text-anchor="start">Paint</text><text x="300" y="408" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="600" fill="#41584f" text-anchor="start">Whole ceiling blends the patch</text><text x="30" y="432" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="600" fill="#41584f" text-anchor="start">From the attic side down to the finished ceiling</text></svg>