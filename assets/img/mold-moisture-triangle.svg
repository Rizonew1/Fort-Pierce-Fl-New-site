231f" stroke-width="2.5"/><text x="120" y="336" font-family="system-ui,Arial,sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">Food</text><circle cx="500" cy="330" r="46" fill="#0e6b63" stroke="#10231f" stroke-width="2.5"/><text x="500" y="336" font-family="system-ui,Arial,sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">Time</text><text x="370" y="70" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="600" fill="#10231f" text-anchor="start">AC drips, roof leaks,</text><text x="370" y="91" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="600" fill="#10231f" text-anchor="start">steam, humid air</text><text x="20" y="398" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="600" fill="#10231f" text-anchor="start">Drywall paper, dust, wood</text><text x="600" y="398" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="600" fill="#10231f" text-anchor="end">Starts in 24 to 48 hours</text></svg>