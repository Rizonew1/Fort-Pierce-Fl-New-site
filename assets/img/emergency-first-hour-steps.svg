<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-label="Six step first hour checklist for a ceiling mold emergency ending with a call to the 24 hour line"><title>Six step first hour checklist for a ceiling mold emergency ending with a call to the 24 hour line</title><rect width="700" height="330" fill="#f5f8f6"/><rect x="20" y="20" width="210" height="130" rx="14" fill="#fff" stroke="#10231f" stroke-width="2"/><circle cx="48" cy="50" r="18" fill="#0e6b63" stroke="#0e6b63" stroke-width="1"/><text x="48" y="57" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="125" y="102" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="800" fill="#10231f" text-anchor="middle">Make it safe</text><text x="125" y="128" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#41584f" text-anchor="middle">People and pets clear</text><rect x="245" y="20" width="210" height="130" rx="14" fill="#fff" stroke="#10231f" stroke-width="2"/><circle cx="273" cy="50" r="18" fill="#0e6b63" stroke="#0e6b63" stroke-width="1"/><text x="273" y="57" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="350" y="102" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="800" fill="#10231f" text-anchor="middle">Power</text><text x="350" y="128" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#41584f" text-anchor="middle">Breaker off if safe</text><rect x="470" y="20" width="210" height="130" rx="14" fill="#fff" stroke="#10231f" stroke-width="2"/><circle cx="498" cy="50" r="18" fill="#0e6b63" stroke="#0e6b63" stroke-width="1"/><text x="498" y="57" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="575" y="102" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="800" fill="#10231f" text-anchor="middle">Stop the water</text><text x="575" y="128" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#41584f" text-anchor="middle">Shutoff, or AC off</text><rect x="20" y="170" width="210" height="130" rx="14" fill="#fff" stroke="#10231f" stroke-width="2"/><circle cx="48" cy="200" r="18" fill="#0e6b63" stroke="#0e6b63" stroke-width="1"/><text x="48" y="207" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="125" y="252" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="800" fill="#10231f" text-anchor="middle">Catch drips</text><text x="125" y="278" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#41584f" text-anchor="middle">Bucket, move valuables</text><rect x="245" y="170" width="210" height="130" rx="14" fill="#fff" stroke="#10231f" stroke-width="2"/><circle cx="273" cy="200" r="18" fill="#0e6b63" stroke="#0e6b63" stroke-width="1"/><text x="273" y="207" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="350" y="252" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="800" fill="#10231f" text-anchor="middle">Photograph</text><text x="350" y="278" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#41584f" text-anchor="middle">Photos and video first</text><rect x="470" y="170" width="210" height="130" rx="14" fill="#c93a17" stroke="#c93a17" stroke-width="2"/><circle cx="498" cy="200" r="18" fill="#fff" stroke="#fff" stroke-width="1"/><text x="498" y="207" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="800" fill="#c93a17" text-anchor="middle">6</text><text x="575" y="252" font-family="system-ui,Arial,sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">Call 24/7</text><text x="575" y="278" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">(772) 710-1549</text></svg>