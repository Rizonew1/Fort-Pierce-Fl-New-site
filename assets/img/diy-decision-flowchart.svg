<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" width="660" height="480" role="img" aria-label="Decision flowchart for deciding whether a ceiling mold spot is a do-it-yourself cleanup or needs a professional"><title>Decision flowchart for deciding whether a ceiling mold spot is a do-it-yourself cleanup or needs a professional</title><rect width="660" height="480" fill="#f5f8f6"/><defs><marker id="d" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#10231f"/></marker></defs><rect x="30" y="20" width="300" height="56" rx="12" fill="#fff" stroke="#10231f" stroke-width="2"/><text x="180" y="55" font-family="system-ui,Arial,sans-serif" font-size="18" font-weight="800" fill="#10231f" text-anchor="middle">Under about 10 sq ft?</text><line x1="330" y1="48" x2="420" y2="48" stroke="#c93a17" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"/><text x="342" y="40" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="800" fill="#c93a17" text-anchor="start">No</text><line x1="180" y1="76" x2="180" y2="112" stroke="#10231f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#d)"/><text x="192" y="100" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="800" fill="#1f7a4d" text-anchor="start">Yes</text><rect x="30" y="112" width="300" height="56" rx="12" fill="#fff" stroke="#10231f" stroke-width="2"/><text x="180" y="147" font-family="system-ui,Arial,sans-serif" font-size="18" font-weight="800" fill="#10231f" text-anchor="middle">Paint firm, no soft spots?</text><line x1="330" y1="140" x2="420" y2="140" stroke="#c93a17" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"/><text x="342" y="132" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="800" fill="#c93a17" text-anchor="start">No</text><line x1="180" y1="168" x2="180" y2="204" stroke="#10231f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#d)"/><text x="192" y="192" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="800" fill="#1f7a4d" text-anchor="start">Yes</text><rect x="30" y="204" width="300" height="56" rx="12" fill="#fff" stroke="#10231f" stroke-width="2"/><text x="180" y="239" font-family="system-ui,Arial,sans-serif" font-size="18" font-weight="800" fill="#10231f" text-anchor="middle">Cause found and fixed?</text><line x1="330" y1="232" x2="420" y2="232" stroke="#c93a17" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"/><text x="342" y="224" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="800" fill="#c93a17" text-anchor="start">No</text><line x1="180" y1="260" x2="180" y2="296" stroke="#10231f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#d)"/><text x="192" y="284" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="800" fill="#1f7a4d" text-anchor="start">Yes</text><rect x="30" y="296" width="300" height="56" rx="12" fill="#fff" stroke="#10231f" stroke-width="2"/><text x="180" y="331" font-family="system-ui,Arial,sans-serif" font-size="18" font-weight="800" fill="#10231f" text-anchor="middle">No one sensitive to mold?</text><line x1="330" y1="324" x2="420" y2="324" stroke="#c93a17" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"/><text x="342" y="316" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="800" fill="#c93a17" text-anchor="start">No</text><line x1="180" y1="352" x2="180" y2="388" stroke="#10231f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#d)"/><text x="192" y="376" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="800" fill="#1f7a4d" text-anchor="start">Yes</text><rect x="420" y="20" width="210" height="330" rx="14" fill="#fdeee9" stroke="#c93a17" stroke-width="3"/><text x="525" y="190" font-family="system-ui,Arial,sans-serif" font-size="22" font-weight="800" fill="#c93a17" text-anchor="middle">Call a</text><text x="525" y="218" font-family="system-ui,Arial,sans-serif" font-size="22" font-weight="800" fill="#c93a17" text-anchor="middle">professional</text><rect x="30" y="388" width="300" height="64" rx="14" fill="#e6f4ec" stroke="#1f7a4d" stroke-width="3"/><text x="180" y="414" font-family="system-ui,Arial,sans-serif" font-size="18" font-weight="800" fill="#1f7a4d" text-anchor="middle">OK to clean carefully</text><text x="180" y="436" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="600" fill="#10231f" text-anchor="middle">Damp wipe, N95, goggles</text></svg>