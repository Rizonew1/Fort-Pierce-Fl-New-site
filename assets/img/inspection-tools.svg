<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-label="Three inspection tools used to find hidden ceiling moisture: moisture meter, thermal camera and borescope"><title>Three inspection tools used to find hidden ceiling moisture: moisture meter, thermal camera and borescope</title><rect width="680" height="330" fill="#f5f8f6"/><rect x="20" y="20" width="200" height="290" rx="14" fill="#fff" stroke="#10231f" stroke-width="2"/><text x="120" y="262" font-family="system-ui,Arial,sans-serif" font-size="18" font-weight="800" fill="#10231f" text-anchor="middle">Moisture meter</text><text x="120" y="288" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="600" fill="#41584f" text-anchor="middle">Finds wet drywall and wood</text><rect x="80" y="50" width="80" height="150" rx="10" fill="#2b3b37" stroke="#10231f" stroke-width="2"/><rect x="92" y="64" width="56" height="40" rx="4" fill="#cfe7f3" stroke="#10231f" stroke-width="1.5"/><rect x="98" y="112" width="8" height="20" rx="1" fill="#1f7a4d" stroke="#1f7a4d" stroke-width="1"/><rect x="112" y="112" width="8" height="28" rx="1" fill="#f2b705" stroke="#f2b705" stroke-width="1"/><rect x="126" y="112" width="8" height="36" rx="1" fill="#c93a17" stroke="#c93a17" stroke-width="1"/><line x1="105" y1="200" x2="105" y2="225" stroke="#10231f" stroke-width="4" stroke-linecap="round"/><line x1="135" y1="200" x2="135" y2="225" stroke="#10231f" stroke-width="4" stroke-linecap="round"/><rect x="240" y="20" width="200" height="290" rx="14" fill="#fff" stroke="#10231f" stroke-width="2"/><text x="340" y="262" font-family="system-ui,Arial,sans-serif" font-size="18" font-weight="800" fill="#10231f" text-anchor="middle">Thermal camera</text><text x="340" y="288" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="600" fill="#41584f" text-anchor="middle">Shows cool, damp patches</text><rect x="280" y="70" width="120" height="100" rx="12" fill="#2b3b37" stroke="#10231f" stroke-width="2"/><rect x="292" y="82" width="96" height="66" rx="6" fill="#18304a" stroke="#10231f" stroke-width="1.5"/><ellipse cx="340" cy="115" rx="34" ry="22" fill="#e84b2a" opacity=".85"/><ellipse cx="340" cy="115" rx="18" ry="11" fill="#f2b705"/><ellipse cx="370" cy="128" rx="14" ry="9" fill="#2f7ab8" opacity=".9"/><rect x="310" y="170" width="60" height="30" rx="6" fill="#2b3b37" stroke="#10231f" stroke-width="2"/><rect x="460" y="20" width="200" height="290" rx="14" fill="#fff" stroke="#10231f" stroke-width="2"/><text x="560" y="262" font-family="system-ui,Arial,sans-serif" font-size="18" font-weight="800" fill="#10231f" text-anchor="middle">Borescope</text><text x="560" y="288" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="600" fill="#41584f" text-anchor="middle">Looks inside a cavity</text><path d="M510 200 c-30 -60 80 -40 50 -90 s70 -10 50 -50" fill="none" stroke="#10231f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><circle cx="610" cy="60" r="12" fill="#2b3b37" stroke="#10231f" stroke-width="2"/><circle cx="610" cy="60" r="5" fill="#cfe7f3" stroke="#10231f" stroke-width="1"/><rect x="490" y="195" width="50" height="24" rx="5" fill="#2b3b37" stroke="#10231f" stroke-width="2"/></svg>